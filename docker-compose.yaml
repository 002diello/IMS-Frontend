version: "3.9"

services:
  # 🗄️ MySQL Database
  db:
    image: mysql:8.0
    container_name: ims-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ims
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ims-network

  # ⚙️ Spring Boot Backend
  backend:
    build: ./ims-backend
    container_name: ims-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ims
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - db
    networks:
      - ims-network

  # 🌐 Vite + React Frontend (Production build served by Nginx)
  frontend:
    build: ./ims-frontend
    container_name: ims-frontend
    ports:
      - "3000:80"
    environment:
      # Used by Vite during build
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - ims-network

# 🔗 Shared network for all services
networks:
  ims-network:
    driver: bridge

# 💾 Persistent MySQL storage
volumes:
  db_data:
